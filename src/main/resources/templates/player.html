<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Play — Baaaad Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family:'Nunito',sans-serif; background:linear-gradient(135deg,#4c1d95 0%,#5b21b6 50%,#6d28d9 100%); min-height:100vh; color:white; }
        .fredoka { font-family:'Fredoka One',cursive; }

        .screen { display:none; }
        .screen.active { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; }

        /* Answer buttons */
        .ans-btn {
            border:none;
            border-radius:25px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:900;
            transition:transform .1s, filter .1s;
            min-height:100%;
        }

        .ans-btn:active {
            transform:scale(0.95);
        }

        .ans-0 { background:#e21b3c; }
        .ans-1 { background:#1368ce; }
        .ans-2 { background:#26890c; }
        .ans-3 { background:#ffa602; }
        .ans-btn.locked { transform:scale(.96); box-shadow:0 0 0 5px rgba(255,255,255,.35) inset, 0 0 24px rgba(255,255,255,.24); }
        .ans-btn.dimmed { opacity:.45; filter:saturate(.7); }

        /*.ans-btn:active { transform:scale(0.94); }*/
        /*.ans-btn:disabled { opacity:.35; cursor:not-allowed; transform:none !important; box-shadow:none !important; }*/
        /*.ans-0 { background:#e21b3c; box-shadow:0 7px 0 #9b1227; }*/
        /*.ans-1 { background:#1368ce; box-shadow:0 7px 0 #0d4fa0; }*/
        /*.ans-2 { background:#26890c; box-shadow:0 7px 0 #165707; }*/
        /*.ans-3 { background:#ffa602; color:#1f2937; box-shadow:0 7px 0 #b87400; }*/
        .ans-0:hover:not(:disabled) { transform:translateY(3px); box-shadow:0 4px 0 #9b1227; }
        .ans-1:hover:not(:disabled) { transform:translateY(3px); box-shadow:0 4px 0 #0d4fa0; }
        .ans-2:hover:not(:disabled) { transform:translateY(3px); box-shadow:0 4px 0 #165707; }
        .ans-3:hover:not(:disabled) { transform:translateY(3px); box-shadow:0 4px 0 #b87400; }

        /* Grass strip */
        .grass-strip { position:fixed; bottom:0; left:0; right:0; height:52px;
            background:linear-gradient(180deg,#4ade80 0%,#16a34a 100%); z-index:1; }
        .grass-strip::before { content:''; position:absolute; top:-14px; left:0; right:0; height:28px;
            background: radial-gradient(ellipse 18px 18px at 50% 100%, #4ade80 50%, transparent 51%) repeat-x;
            background-size:28px 28px; }

        .pop-in { animation: popIn .45s cubic-bezier(0.34,1.56,0.64,1) both; }
        @keyframes popIn { from{transform:scale(0.3);opacity:0} to{transform:scale(1);opacity:1} }

        .sheep-float { animation: sheepFloat 2.5s ease-in-out infinite alternate; }
        @keyframes sheepFloat { from{transform:translateY(0)} to{transform:translateY(-10px)} }

        .pulse-ring { animation: pulseRing 1s ease-in-out infinite; }
        @keyframes pulseRing { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.06);opacity:.8} }

        /* Waiting dots */
        .dot { animation: dotBounce 1.2s ease-in-out infinite; display:inline-block; }
        .dot:nth-child(2){animation-delay:.2s}
        .dot:nth-child(3){animation-delay:.4s}
        @keyframes dotBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .answer-meta { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:8px 14px; font-weight:900; }
        .review-card { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:16px; }
        .review-answer { border-radius:14px; padding:10px 12px; margin-top:8px; font-weight:900; }
        .review-correct { background:rgba(34,197,94,.22); border:2px solid #22c55e; }
        .review-wrong { background:rgba(239,68,68,.22); border:2px solid #ef4444; }
        .question-result { width:100%; max-width:420px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18); border-radius:22px; padding:18px; box-shadow:0 18px 40px rgba(0,0,0,.18); }
        .mini-stat { background:rgba(255,255,255,.12); border-radius:14px; padding:10px 12px; }
        .rank-move { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 10px; background:rgba(255,255,255,.15); font-weight:900; animation: deltaFade 2.4s ease forwards; }
        .ready-number { animation: readyPop 1s ease-in-out infinite; }
        .review-card summary { cursor:pointer; list-style:none; }
        .review-card summary::-webkit-details-marker { display:none; }
        .rank-up { color:#86efac; }
        .rank-down { color:#fca5a5; }
        @keyframes deltaFade { 0%,65%{opacity:1} 100%{opacity:0} }
        @keyframes readyPop { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.12);opacity:.86} }
        @media (max-width: 640px) {
            .screen.active { padding:18px 12px 76px; }
        }
    </style>
</head>
<body class="pb-14">

<!-- ── WAITING SCREEN ────────────────────────────────────────────────────── -->
<div class="screen active" id="screenWaiting">
    <div class="sheep-float mb-6" id="avatarDisplay">
        <!-- filled by JS -->
    </div>
    <h1 class="fredoka text-3xl sm:text-4xl mb-2">You're in!</h1>
    <div class="bg-white bg-opacity-15 rounded-2xl px-6 py-3 font-black text-xl mb-4" id="nameBadge">Player</div>
    <div class="text-purple-200 font-bold text-sm">
        Waiting for the host
        <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
</div>

<!-- ── GET READY SCREEN ─────────────────────────────────────────────────── -->
<div class="screen" id="screenReady">
    <div class="text-purple-200 font-black uppercase tracking-[0.2em] mb-3" id="readyQuestionLabel">Question 1/5</div>
    <h1 class="fredoka text-4xl sm:text-5xl mb-5">Get ready!</h1>
    <div class="ready-number fredoka text-7xl text-yellow-300" id="readyNumber">3</div>
</div>

<!-- ── ANSWER SCREEN ─────────────────────────────────────────────────────── -->
<div class="screen" id="screenAnswer">
    <div class="w-full max-w-2xl flex flex-col items-center gap-4">
        <div class="answer-meta text-purple-100">
            <span id="playerAnswersCount">0</span> / <span id="playerTotalPlayers">0</span> people answered
        </div>
        <div class="bg-white text-gray-800 rounded-2xl px-5 py-4 text-center w-full shadow-xl">
            <div class="font-black text-lg sm:text-xl leading-snug" id="questionText">Question loading...</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full h-[52vh]" id="answerGrid"></div>
    </div>
</div>

<!-- ── SUBMITTED SCREEN ───────────────────────────────────────────────────── -->
<div class="screen" id="screenSubmitted">
    <div class="text-7xl pop-in mb-5">✅</div>
    <h2 class="fredoka text-3xl mb-2">Answer locked in!</h2>
    <p class="text-purple-200 font-bold text-sm">
        Waiting for others
        <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </p>
    <div class="answer-meta mt-5 text-purple-100">
        <span id="submittedAnswersCount">0</span> / <span id="submittedTotalPlayers">0</span> people answered
    </div>
</div>

<!-- ── RESULTS SCREEN ────────────────────────────────────────────────────── -->
<div class="screen" id="screenResults">
    <div class="question-result text-center pop-in">
        <div id="resultBadge" class="w-20 h-20 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 shadow-2xl">🎉</div>
        <h2 class="fredoka text-3xl sm:text-4xl mb-1" id="resultTitle">Correct!</h2>
        <div class="fredoka text-4xl text-yellow-300 mb-4" id="pointsDisplay">+0 pts</div>
        <div class="grid grid-cols-2 gap-2 text-left mb-3">
            <div class="mini-stat">
                <div class="text-purple-200 text-xs font-black uppercase tracking-widest">Total</div>
                <div class="font-black text-xl" id="scoreDisplay">0 pts</div>
            </div>
            <div class="mini-stat">
                <div class="text-purple-200 text-xs font-black uppercase tracking-widest">Rank</div>
                <div class="font-black text-xl" id="rankBadge">#1</div>
            </div>
            <div class="mini-stat">
                <div class="text-purple-200 text-xs font-black uppercase tracking-widest">Streak</div>
                <div class="font-black text-xl" id="streakDisplay">0</div>
            </div>
            <div class="mini-stat">
                <div class="text-purple-200 text-xs font-black uppercase tracking-widest">Group</div>
                <div class="font-black text-xl" id="groupCorrectDisplay">0 / 0</div>
            </div>
        </div>
        <div class="hidden text-left" id="answerCorrection"></div>
    </div>
</div>

<!-- ── FINISHED SCREEN ───────────────────────────────────────────────────── -->
<div class="screen" id="screenFinished">
    <div class="text-7xl mb-4" style="animation:sheepFloat 2s ease-in-out infinite alternate" id="finalEmoji">🏆</div>
    <h2 class="fredoka text-4xl mb-2">Game Over!</h2>
    <div class="fredoka text-5xl text-yellow-300 my-3" id="finalScore">0</div>
    <div class="text-purple-200 font-bold mb-6" id="finalRank">points</div>
    <div class="w-full max-w-3xl mt-4 mb-5" id="reviewPanel"></div>
    <button onclick="window.location.href='/'"
            class="bg-yellow-400 text-gray-800 border-none rounded-2xl px-8 py-4 font-black text-lg cursor-pointer"
            style="font-family:'Nunito',sans-serif; box-shadow:0 5px 0 #b45309">
        Play Again 🐑
    </button>
</div>

<div class="grass-strip"></div>

<script>
    // ── Avatar builder ─────────────────────────────────────────────────────
    function sheepSvg(wool, head, hoof) {
        return `<svg viewBox="0 0 80 72" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="38" cy="38" rx="22" ry="17" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="18" cy="30" r="10" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="30" cy="22" r="12" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="46" cy="21" r="11" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="58" cy="29" r="9"  fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="67" cy="39" rx="10" ry="9" fill="${head}"/>
    <circle cx="71" cy="35.5" r="1.8" fill="white"/><circle cx="71.8" cy="35.5" r=".9" fill="#111"/>
    <ellipse cx="62" cy="32" rx="4" ry="2.5" fill="${head}" transform="rotate(-22,62,32)"/>
    <rect x="20" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="30" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="44" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="54" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="20" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
    <rect x="30" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
    <rect x="44" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
    <rect x="54" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
  </svg>`;
    }
    const AVATAR_MAP = {
        white:  sheepSvg('#f9fafb','#374151','#111827'),
        black:  sheepSvg('#1f2937','#f3f4f6','#111827'),
        brown:  sheepSvg('#d97706','#78350f','#451a03'),
        pink:   sheepSvg('#fbcfe8','#9d174d','#831843'),
        blue:   sheepSvg('#bfdbfe','#1e40af','#1e3a8a'),
        yellow: sheepSvg('#fef08a','#713f12','#451a03'),
        green:  sheepSvg('#bbf7d0','#14532d','#052e16'),
        purple: sheepSvg('#e9d5ff','#6b21a8','#3b0764'),
    };

    // ── Params ────────────────────────────────────────────────────────────
    const PET_IMAGES = [
        '/images/ben.png',
        '/images/domis.png',
        '/images/loco.jpeg',
        '/images/poco.jpeg',
        '/images/kedi1.png',
        '/images/kedi2.png'
    ];

    const params  = new URLSearchParams(window.location.search);
    const CODE    = params.get('code')   || sessionStorage.getItem('gameCode')   || '';
    const PLAYER  = params.get('name')   || sessionStorage.getItem('playerName') || 'Player';
    const AVATAR  = params.get('avatar') || sessionStorage.getItem('avatarId')   || 'white';

    document.getElementById('nameBadge').textContent = PLAYER;
    document.getElementById('avatarDisplay').innerHTML =
        `<div class="w-32 h-28">${AVATAR_MAP[AVATAR]||AVATAR_MAP.white}</div>`;

    let myScore = 0, hasAnswered = false, lastAnswer = -1, totalPlayers = 0;
    let readyInterval = null, submitFeedbackTimer = null;

    // ── WebSocket ─────────────────────────────────────────────────────────
    const socket = new SockJS('/ws');
    const stomp  = Stomp.over(socket);
    stomp.debug  = null;

    stomp.connect({}, () => {
        stomp.subscribe(`/topic/game/${CODE}`, msg => handleEvent(JSON.parse(msg.body)));
    });

    function handleEvent(data) {
        console.log("EVENT RECEIVED:", data);
        const s = (data.status||'').toLowerCase();
        if (s==='get_ready') showReady(data);
        if (s==='question') {
            if (data.questionText) onQuestion(data);
            updateAnswerProgress(data);
        }
        if (s==='results')  onResults(data);
        if (s==='finished') onFinished(data);
    }

    function updateAnswerProgress(data) {
        if (typeof data.totalPlayers === 'number') totalPlayers = data.totalPlayers;
        const answered = typeof data.answeredCount === 'number' ? data.answeredCount : 0;
        document.getElementById('playerAnswersCount').textContent = answered;
        document.getElementById('playerTotalPlayers').textContent = totalPlayers;
        document.getElementById('submittedAnswersCount').textContent = answered;
        document.getElementById('submittedTotalPlayers').textContent = totalPlayers;
    }

    function onQuestion(data) {
        clearInterval(readyInterval);
        clearTimeout(submitFeedbackTimer);
        hasAnswered = false;
        lastAnswer = -1;

        updateAnswerProgress(data);
        showScreen('screenAnswer');

        document.querySelectorAll('.ans-btn').forEach(b => b.disabled = false);

        const qEl = document.getElementById('questionText');
        if (qEl) qEl.textContent = data.questionText;

        const grid = document.getElementById('answerGrid');

        const icons = ['▲','●','■','✦'];

        grid.innerHTML = data.options.map((opt, i) => `
        <button class="ans-btn ans-${i}" onclick="submitAnswer(${i})">
            <span class="text-4xl">${icons[i]}</span>
            <span class="sr-only">${esc(opt)}</span>
        </button>
    `).join('');
    }

    function showReady(data) {
        clearInterval(readyInterval);
        clearTimeout(submitFeedbackTimer);
        showScreen('screenReady');
        document.getElementById('readyQuestionLabel').textContent = `Question ${data.questionNumber}/${data.totalQuestions}`;
        let left = data.readySeconds || 3;
        const num = document.getElementById('readyNumber');
        function tick() {
            num.textContent = left;
            if (left <= 1) {
                clearInterval(readyInterval);
                return;
            }
            left--;
        }
        tick();
        readyInterval = setInterval(tick, 1000);
    }

    function submitAnswer(idx) {
        if (hasAnswered) return;
        hasAnswered = true; lastAnswer = idx;
        document.querySelectorAll('.ans-btn').forEach((b, i) => {
            b.disabled = true;
            b.classList.toggle('locked', i === idx);
            b.classList.toggle('dimmed', i !== idx);
        });
        stomp.send('/app/answer', {}, JSON.stringify({ gameCode:CODE, playerName:PLAYER, answerIndex:idx }));
        submitFeedbackTimer = setTimeout(() => {
            if (hasAnswered) showScreen('screenSubmitted');
        }, 320);
    }



    function onResults(data) {
        clearTimeout(submitFeedbackTimer);
        const result = (data.playerResults||[]).find(p => p.playerName===PLAYER);
        const correct  = data.correctIndex;
        const wasRight = result ? result.correct : lastAnswer === correct;
        const me       = (data.leaderboard||[]).find(p => p.playerName===PLAYER);
        const previousScore = myScore;
        if (result) myScore = result.totalScore;
        else if (me) myScore = me.score;

        const badge = document.getElementById('resultBadge');
        if (wasRight) {
            const randomPet = PET_IMAGES[Math.floor(Math.random() * PET_IMAGES.length)];

            // Replace innerHTML with the image and style the container
            badge.innerHTML = `<img src="${randomPet}" class="w-full h-full object-cover rounded-full" alt="Correct!" />`;
            badge.style.background = 'transparent';
            badge.style.border = '4px solid #22c55e'; // Add a nice green ring around the pet

            document.getElementById('resultTitle').textContent = 'Correct!';
        } else {
            // Revert back to the wrong emoji configuration
            badge.innerHTML = '😬';
            badge.style.background = '#ef4444';

            document.getElementById('resultTitle').textContent = 'Wrong…';
        }

        const rank = result ? result.rank : (me ? me.rank : '?');
        animateNumberText(document.getElementById('pointsDisplay'), 0, result ? result.pointsEarned : 0, 500, '+', ' pts');
        animateNumberText(document.getElementById('scoreDisplay'), previousScore, myScore, 520, '', ' pts');
        document.getElementById('rankBadge').innerHTML = `#${rank} ${rankDeltaBadge(result ? result.rankDelta : 0)}`;
        document.getElementById('streakDisplay').textContent = result ? `${result.streak}` : '0';
        document.getElementById('groupCorrectDisplay').textContent = result
            ? `${result.correctCount} / ${result.answeredCount}`
            : '0 / 0';
        renderQuestionCorrection(result);
        showScreen('screenResults');
    }

    function renderQuestionCorrection(result) {
        const el = document.getElementById('answerCorrection');
        if (!result || result.correct) {
            el.classList.add('hidden');
            el.innerHTML = '';
            return;
        }
        el.classList.remove('hidden');
        el.innerHTML = `
            <div class="review-answer review-wrong">Your answer: ${esc(result.selectedAnswerText)}</div>
            <div class="review-answer review-correct">Correct answer: ${esc(result.correctAnswerText)}</div>
        `;
    }

    function rankDeltaBadge(delta) {
        if (!delta) return '';
        const cls = delta > 0 ? 'rank-up' : 'rank-down';
        const text = delta > 0 ? `↑${delta}` : `↓${Math.abs(delta)}`;
        return `<span class="rank-move ${cls}">${text}</span>`;
    }

    function onFinished(data) {
        clearInterval(readyInterval);
        clearTimeout(submitFeedbackTimer);
        const me   = (data.leaderboard||[]).find(p => p.playerName===PLAYER);
        const review = (data.playerReviews||[]).find(p => p.playerName===PLAYER);
        if (me) myScore = me.score;
        const rank = me ? me.rank : '?';
        const emojis = {1:'🏆',2:'🥈',3:'🥉'};
        document.getElementById('finalEmoji').textContent  = emojis[rank] || '🐑';
        document.getElementById('finalScore').textContent  = `${myScore} pts`;
        document.getElementById('finalRank').textContent   = `You finished #${rank}`;
        renderReview(review);
        showScreen('screenFinished');
    }

    function renderReview(review) {
        const panel = document.getElementById('reviewPanel');
        if (!review) {
            panel.innerHTML = '';
            return;
        }
        panel.innerHTML = `
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
                ${summaryTile('Correct', review.correctCount)}
                ${summaryTile('Incorrect', review.incorrectCount)}
                ${summaryTile('Accuracy', `${review.accuracyPercentage}%`)}
                ${summaryTile('Score', review.finalScore)}
            </div>
            <div class="flex flex-col gap-3 max-h-[44vh] overflow-y-auto pr-1">
                ${(review.answers||[]).map(answer => reviewCard(answer)).join('')}
            </div>
        `;
    }

    function summaryTile(label, value) {
        return `<div class="review-card text-center"><div class="text-purple-200 text-xs font-black uppercase tracking-widest">${label}</div><div class="text-2xl font-black">${value}</div></div>`;
    }

    function reviewCard(answer) {
        const selectedClass = answer.correct ? 'review-correct' : 'review-wrong';
        const selectedLabel = answer.correct ? 'Your answer' : 'Your answer';
        const correctBlock = answer.correct ? '' : `
            <div class="review-answer review-correct">
                Correct answer: ${esc(answer.correctAnswerText)}
            </div>`;
        return `
            <details class="review-card text-left">
                <summary class="flex items-start justify-between gap-3">
                    <div class="font-black">Q${answer.questionNumber}. ${esc(answer.questionText)}</div>
                    <div class="font-black ${answer.correct ? 'text-green-300' : 'text-red-300'}">${answer.correct ? 'Correct' : 'Wrong'}</div>
                </summary>
                <div class="review-answer ${selectedClass}">
                    ${selectedLabel}: ${esc(answer.selectedAnswerText)}
                </div>
                ${correctBlock}
                <div class="text-yellow-200 font-black mt-2">${answer.pointsEarned} pts</div>
            </details>
        `;
    }

    function animateNumberText(el, from, to, duration, prefix, suffix) {
        if (!el) return;
        if (from === to) {
            el.textContent = `${prefix}${to}${suffix}`;
            return;
        }
        const start = performance.now();
        function step(now) {
            const pct = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - pct, 3);
            el.textContent = `${prefix}${Math.round(from + (to - from) * eased)}${suffix}`;
            if (pct < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
