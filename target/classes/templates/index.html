    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .fredoka { font-family: 'Fredoka One', cursive; }

        .sky-bg { background: linear-gradient(180deg, #bfdbfe 0%, #dbeafe 40%, #eff6ff 100%); }

        /* Sliding sheep */
        .sliding-sheep {
            animation: sheepSlide 14s linear infinite;
            position: fixed; bottom: 62px; left: -160px; z-index: 2; pointer-events: none;
        }
        @keyframes sheepSlide {
            0%   { left: -160px; transform: scaleX(1); }
            48%  { left: calc(100vw + 20px); transform: scaleX(1); }
            50%  { left: calc(100vw + 20px); transform: scaleX(-1); }
            98%  { left: -160px; transform: scaleX(-1); }
            100% { left: -160px; transform: scaleX(1); }
        }

        /* Clouds */
        .cloud { position: fixed; background: white; border-radius: 50px; opacity: 0.9; pointer-events: none; z-index: 0; }
        .cloud::before, .cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
        .cloud::before { width:55%; height:130%; top:-40%; left:15%; }
        .cloud::after  { width:40%; height:110%; top:-25%; right:10%; }
        .cloud-1 { width:130px; height:42px; top:7%;  animation: cloudDrift 32s linear infinite; left:-160px; }
        .cloud-2 { width:80px;  height:28px; top:20%; animation: cloudDrift 48s linear infinite 18s; left:-100px; }
        .cloud-3 { width:105px; height:36px; top:12%; animation: cloudDrift 40s linear infinite 9s; left:-140px; }
        @keyframes cloudDrift { from {left:-160px} to {left:calc(100vw + 160px)} }

        /* Grass strip */
        .grass-strip {
            position: fixed; bottom:0; left:0; right:0; height:62px;
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); z-index:1;
        }
        .grass-strip::before {
            content:''; position:absolute; top:-16px; left:0; right:0; height:32px;
            background: radial-gradient(ellipse 20px 20px at 50% 100%, #4ade80 50%, transparent 51%) repeat-x;
            background-size: 30px 30px;
        }

        /* Avatar */
        .avatar-card { cursor:pointer; transition: transform 0.15s, box-shadow 0.15s; border: 3px solid transparent; border-radius: 16px; }
        .avatar-card:hover  { transform: scale(1.1); }
        .avatar-card.chosen { border-color: #7c3aed; transform: scale(1.13); box-shadow: 0 0 0 4px #ddd6fe; background: #f5f3ff; }

        .sheep-input {
            background:white; border: 3px solid #e5e7eb; border-radius:14px;
            padding: 13px 18px; font-size:1.05rem; font-family:'Nunito',sans-serif;
            font-weight:700; width:100%; outline:none; text-align:center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .sheep-input:focus { border-color:#7c3aed; box-shadow: 0 0 0 4px #ede9fe; }

        .btn-purple {
            background: linear-gradient(135deg,#7c3aed,#6d28d9); color:white; border:none;
            border-radius:14px; padding:15px; font-size:1.05rem; font-family:'Nunito',sans-serif;
            font-weight:900; cursor:pointer; width:100%; box-shadow: 0 5px 0 #4c1d95;
            transition: transform 0.1s, box-shadow 0.1s; letter-spacing:.3px;
        }
        .btn-purple:hover  { transform:translateY(2px); box-shadow: 0 3px 0 #4c1d95; }
        .btn-purple:active { transform:translateY(4px); box-shadow: 0 1px 0 #4c1d95; }

        .btn-green {
            background: linear-gradient(135deg,#059669,#047857); color:white; border:none;
            border-radius:14px; padding:15px; font-size:1.05rem; font-family:'Nunito',sans-serif;
            font-weight:900; cursor:pointer; width:100%; box-shadow: 0 5px 0 #064e3b;
            transition: transform 0.1s, box-shadow 0.1s; letter-spacing:.3px;
        }
        .btn-green:hover  { transform:translateY(2px); box-shadow: 0 3px 0 #064e3b; }
        .btn-green:active { transform:translateY(4px); box-shadow: 0 1px 0 #064e3b; }

        .bounce-in { animation: bounceIn 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
        @keyframes bounceIn { from{transform:scale(0.6) translateY(24px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
    </style>
</head>

<!-- Card -->
<div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 relative z-10 bounce-in" style="animation-delay:0.12s">

    <!-- JOIN -->
    <p class="text-xs font-black uppercase tracking-[0.18em] text-gray-400 mb-3">🎮 Join a Game</p>
    <div class="flex flex-col gap-3">
        <input class="sheep-input" id="gameCode" placeholder="GAME PIN" maxlength="4"
               oninput="this.value=this.value.toUpperCase()" autocomplete="off" style="letter-spacing:0.2em"/>
        <input class="sheep-input" id="playerName" placeholder="Your nickname" maxlength="20" autocomplete="off"/>
    </div>

    <!-- Avatar grid -->
    <div class="mt-5">
        <p class="text-xs font-black uppercase tracking-[0.18em] text-gray-400 mb-2">Pick your sheep</p>
        <div class="grid grid-cols-4 gap-2" id="avatarGrid"></div>
    </div>

    <div id="joinError" class="hidden mt-3 bg-red-50 text-red-500 rounded-xl px-4 py-2 text-sm font-bold text-center"></div>
    <button class="btn-purple mt-4" onclick="joinGame()">Enter the Flock →</button>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-gray-100"></div>
        <span class="text-gray-300 font-black text-xs">OR</span>
        <div class="flex-1 h-px bg-gray-100"></div>
    </div>

    <!-- HOST -->
    <p class="text-xs font-black uppercase tracking-[0.18em] text-gray-400 mb-3">🏆 Host a Game</p>
    <button class="btn-green" onclick="hostGame()">Create New Game</button>
</div>

<div class="grass-strip"></div>

<script>
    // ── Avatar definitions ───────────────────────────────────────────────────
    function sheepSvg(wool, head, hoof) {
        return `<svg viewBox="0 0 80 72" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="38" cy="38" rx="22" ry="17" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="18" cy="30" r="10" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="30" cy="22" r="12" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="46" cy="21" r="11" fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="58" cy="29" r="9"  fill="${wool}" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="67" cy="39" rx="10" ry="9" fill="${head}"/>
    <circle cx="71" cy="35.5" r="1.8" fill="white"/><circle cx="71.8" cy="35.5" r=".9" fill="#111"/>
    <ellipse cx="62" cy="32" rx="4" ry="2.5" fill="${head}" transform="rotate(-22,62,32)"/>
    <rect x="20" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="30" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="44" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="54" y="52" width="6" height="14" rx="3" fill="${head}"/>
    <rect x="20" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
    <rect x="30" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
    <rect x="44" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
    <rect x="54" y="62" width="6" height="5" rx="2" fill="${hoof}"/>
  </svg>`;
    }

    const AVATARS = [
        { id:'white',  label:'Fluffy',  svg: sheepSvg('#f9fafb','#374151','#111827') },
        { id:'black',  label:'Shadow',  svg: sheepSvg('#1f2937','#f3f4f6','#111827') },
        { id:'brown',  label:'Caramel', svg: sheepSvg('#d97706','#78350f','#451a03') },
        { id:'pink',   label:'Rosie',   svg: sheepSvg('#fbcfe8','#9d174d','#831843') },
        { id:'blue',   label:'Cloudy',  svg: sheepSvg('#bfdbfe','#1e40af','#1e3a8a') },
        { id:'yellow', label:'Sunny',   svg: sheepSvg('#fef08a','#713f12','#451a03') },
        { id:'green',  label:'Clover',  svg: sheepSvg('#bbf7d0','#14532d','#052e16') },
        { id:'purple', label:'Grape',   svg: sheepSvg('#e9d5ff','#6b21a8','#3b0764') },
    ];

    let chosenAvatar = 'white';

    function renderAvatars() {
        document.getElementById('avatarGrid').innerHTML = AVATARS.map(a => `
    <div class="avatar-card p-2 bg-gray-50 flex flex-col items-center gap-1 ${a.id===chosenAvatar?'chosen':''}"
         onclick="pickAvatar('${a.id}',this)">
      <div class="w-12 h-10">${a.svg}</div>
      <div class="text-xs font-bold text-gray-500 leading-none">${a.label}</div>
    </div>`).join('');
    }

    function pickAvatar(id, el) {
        chosenAvatar = id;
        document.querySelectorAll('.avatar-card').forEach(c => c.classList.remove('chosen'));
        el.classList.add('chosen');
    }

    // ── Actions ──────────────────────────────────────────────────────────────
    async function joinGame() {
        const code = document.getElementById('gameCode').value.trim().toUpperCase();
        const name = document.getElementById('playerName').value.trim();
        if (!code || code.length < 4) { showErr('Enter a 4-letter game PIN'); return; }
        if (!name)                     { showErr('Enter your nickname');        return; }
        try {
            const res  = await fetch(`/api/game/${code}/join`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                    playerName: name,
                    avatarId: chosenAvatar,
                    playerId: sessionStorage.getItem(`playerId:${code}:${name}`) || null
                })
            });
            const data = await res.json();
            if (data.success) {
                sessionStorage.setItem('playerName', name);
                sessionStorage.setItem('gameCode',   code);
                sessionStorage.setItem('avatarId',   chosenAvatar);
                if (data.playerId) {
                    sessionStorage.setItem(`playerId:${code}:${name}`, data.playerId);
                    sessionStorage.setItem('playerId', data.playerId);
                }
                window.location.href = `/player?code=${code}&name=${encodeURIComponent(name)}&avatar=${chosenAvatar}`;
            } else { showErr(data.message || 'Could not join'); }
        } catch(e) { showErr('Connection error'); }
    }

    async function hostGame() {
        try {
            const res  = await fetch('/api/game/create', { method:'POST' });
            const data = await res.json();
            if (!data.gameCode) { showErr('No code returned'); return; }
            window.location.href = `/host?code=${data.gameCode}`;
        } catch(e) { showErr('Connection error'); }
    }

    function showErr(msg) {
        const el = document.getElementById('joinError');
        el.textContent = msg; el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    document.getElementById('gameCode').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('playerName').focus(); });
    document.getElementById('playerName').addEventListener('keydown', e => { if(e.key==='Enter') joinGame(); });
    renderAvatars();
</script>
</body>
</html>
